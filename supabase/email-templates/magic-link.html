<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kizuna — Giriş Linki</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:'Courier New',Courier,monospace;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f4f4;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background-color:#ffffff;border:2px solid #1a1c2c;box-shadow:4px 4px 0 #1a1c2c;">
          <tr>
            <td style="padding:28px 24px 16px;text-align:center;background:linear-gradient(180deg,#dbefff 0%,#ffffff 100%);">
              <p style="margin:0 0 8px;font-size:11px;letter-spacing:2px;color:#41a6f6;">♥ KIZUNA</p>
              <h1 style="margin:0;font-size:20px;color:#1a1c2c;font-weight:bold;">Giriş yap</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 24px 24px;color:#1a1c2c;">
              <p style="margin:0 0 16px;font-size:14px;line-height:1.7;">
                Mochi seni bekliyor! Aşağıdaki butona tıklayarak Kizuna'ya giriş yapabilirsin.
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin:24px auto;">
                <tr>
                  <td style="background-color:#41a6f6;border:2px solid #1a1c2c;box-shadow:4px 4px 0 #1a1c2c;">
                    <a href="{{ .ConfirmationURL }}" target="_blank"
                       style="display:inline-block;padding:14px 28px;font-size:14px;font-weight:bold;color:#1a1c2c;text-decoration:none;">
                      Kizuna'ya giriş yap
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:11px;line-height:1.5;word-break:break-all;color:#41a6f6;">
                <a href="{{ .ConfirmationURL }}" style="color:#41a6f6;">{{ .ConfirmationURL }}</a>
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px 24px;border-top:2px dashed #e0e0e0;text-align:center;">
              <p style="margin:0;font-size:10px;color:#999;">Bu isteği sen yapmadıysan bu maili yok say.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
